<!-- viewBox is cropped to the drawing rather than padded: the cushion has to
     fill as much of the element as it can, because the four played cards land
     inside it and need a margin of table showing around them.

     Everything here is a plain shape in a solid colour, drawn out in full.
     That is deliberate and costs repetition, because the shorthands an SVG
     normally uses for this were each ignored somewhere:

       <use href="#id">   dropped the referenced shape, leaving a bare gold
                          cross on an empty table
       fill="url(#grad)"  ignored, leaving the cushion grey with no red ground
                          and no gold border
       fill="url(#pat)"   ignored, leaving the cushion a flat red with no
                          brocade

     So: the outline is repeated at each place it is used, depth comes from
     translucent solids stacked on each other, and the 七宝 lattice is written
     out as circles rather than tiled with <pattern>. Only <clipPath> is still
     relied on, which does resolve. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 36 568 568" width="568" height="568" role="presentation">
  <title>西陣織の座布団</title>
  <defs>
    <clipPath id="zabutonClip">
      <path d="M 116,62 Q 320,42 524,62 Q 578,70 578,116 Q 598,320 578,524 Q 570,578 524,578 Q 320,598 116,578 Q 62,570 62,524 Q 42,320 62,116 Q 70,62 116,62 Z" />
    </clipPath>
  </defs>

  <!-- Shadow: the same outline in black, nudged down and stacked so the edge
       softens. fill-opacity per path rather than opacity on the group, which
       not every engine honours. -->
  <g fill="#000000">
    <path d="M 116,62 Q 320,42 524,62 Q 578,70 578,116 Q 598,320 578,524 Q 570,578 524,578 Q 320,598 116,578 Q 62,570 62,524 Q 42,320 62,116 Q 70,62 116,62 Z" transform="translate(0 14)" fill-opacity="0.10" />
    <path d="M 116,62 Q 320,42 524,62 Q 578,70 578,116 Q 598,320 578,524 Q 570,578 524,578 Q 320,598 116,578 Q 62,570 62,524 Q 42,320 62,116 Q 70,62 116,62 Z" transform="translate(0 9)" fill-opacity="0.10" />
    <path d="M 116,62 Q 320,42 524,62 Q 578,70 578,116 Q 598,320 578,524 Q 570,578 524,578 Q 320,598 116,578 Q 62,570 62,524 Q 42,320 62,116 Q 70,62 116,62 Z" transform="translate(0 4)" fill-opacity="0.10" />
  </g>

  <!-- 房 (tassels) at the four corners, behind the body so they read as
       tucked under the seam. -->
  <g stroke="#c9a34e" stroke-linecap="round" fill="none" stroke-opacity="0.92" stroke-width="4">
