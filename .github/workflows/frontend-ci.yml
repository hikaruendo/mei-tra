name: Frontend CI

on:
  pull_request:
    paths:
      - 'mei-tra-frontend/**'
      - 'contracts/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mei-tra-frontend

jobs:
  quality:
    name: Frontend lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mei-tra-frontend/package-lock.json

      # @meitra/contracts, @meitra/game-client and @meitra/api-client are
      # file: links to contracts/ and shared/, so the whole repo must be
      # checked out before this install resolves.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci
