name: Create X Post Draft

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to summarize
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  create-draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'x:share'))
    runs-on: ubuntu-latest

    steps:
      - name: Create a text-only approval draft
        uses: actions/github-script@v7
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(process.env.MANUAL_PR_NUMBER)
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const labels = pr.labels.map((label) => label.name);
            if (!pr.merged_at || pr.base.ref !== 'main' || !labels.includes('x:share')) {
              core.setFailed(`PR #${prNumber} must be a merged main PR with the x:share label.`);
              return;
            }

            const titleSource = pr.title.toLowerCase();
            const bodySource = (pr.body || '').toLowerCase();
            const summaryRules = [
              {
                test: /customize team names|team names|チーム名/,
                text: 'チーム名を分かりやすく設定できるようにしました。',
                detail: '待機画面・対局中・履歴画面で同じチーム名を表示し、長い名前も崩れにくくしています。',
              },
              {
                test: /score|得点|スコア/,
                text: 'チームごとの得点表示を正しい色と位置にそろえました。',
                detail: 'どのチームが何点取ったかを、対局画面と履歴画面で迷わず確認できます。',
              },
              {
                test: /ゲーム画面の操作性と履歴表示|history|replay|履歴|リプレイ/,
                text: '手札の並べ替え、手番時計、取得組数、得点を対局中に確認しやすくしました。',
                detail: '右上の履歴からラウンド結果とチーム別得点を振り返れ、横長の小さな画面でも場札を確認できます。',
              },
              {
                test: /post-158 game ui labels|contrast|label|accessib|dark.mode|表示と操作|操作性|アクセシビリティ/,
                text: 'ゲーム画面のラベルとコントラストを見直し、状態を読み取りやすくしました。',
                detail: '暗いテーマでも宣言やボタンの意味が伝わり、チーム名編集などの操作位置も分かりやすくなっています。',
              },
              {
                test: /fix reconnect player identity|再接続.*プレイヤー|プレイヤー.*再接続/,
                text: '再接続時に、ログイン中のプレイヤーを正しい席へ復元するようにしました。',
                detail: '画面を更新しても自分の席・手札・手番を保ち、古いセッションによる二重登録も防ぎます。',
              },
              {
                test: /normalize current player identity and seat order|current player identity/,
                text: '席順と現在の手番の管理方法を一本化しました。',
                detail: '人間プレイヤーとCOMの入れ替え後も、同じ席の手番を正しく引き継げます。',
              },
              {
                test: /roster conflicts on player leave|player leave/,
                text: 'プレイヤーが退出したときの席とCOMの割り当てを整理しました。',
                detail: '重複したCOMや、すでに終わったプレイヤーに戻る手番を防ぎ、途中参加後も対局を続けられます。',
              },
              {
                test: /stabilize active room recovery|active room recovery/,
                text: '切断やブラウザ再読み込み後のルーム復帰を安定させました。',
                detail: '同じアカウントの古いタブを整理し、戻るべき席と対局状態を一つに保ちます。',
              },
              {
                test: /unify active room membership transitions|membership transitions|cross-room/,
                text: 'ルーム参加・退出・COM置き換え時の在籍状態を一貫して管理するようにしました。',
                detail: '別ルームへの誤参加を防ぎ、退出後は次のルームへ安全に参加できます。',
              },
              {
                test: /add active room membership contract|active room membership contract|advisory locks/,
                text: '1人1ルームの在籍状態をサーバーで一元管理する仕組みを追加しました。',
                detail: '同時操作や古い切断処理が新しい参加状態を消さないようにし、競合を追跡できます。',
              },
              {
                test: /immediate com replacement after disconnect|com replacement.*disconnect/,
                text: '切断直後にCOMへ交代しても、席と手番を正しく保つようにしました。',
                detail: '再接続した人を誤ってCOM扱いせず、古いタイマーによる二重交代も防ぎます。',
              },
              {
                test: /stabilize player lifecycle and seat order|player lifecycle/,
                text: 'プレイヤーの参加・切断・退出と席順の扱いを安定させました。',
                detail: 'ルーム削除後に古いCOM復帰処理が走らず、再読み込み後も正しい順番で遊べます。',
              },
              {
                test: /fix links to x media artifacts|media artifacts/,
                text: 'X投稿下書きのメディア確認リンクを、実行ページへ正しくつなぎました。',
                detail: '404になりやすい一覧URLを避け、レビュアーが投稿前に素材を確認しやすくしています。',
              },
              {
                test: /install ffmpeg for x media capture|ffmpeg|media capture/,
                text: 'X投稿用動画の変換環境を整え、撮影結果をMP4にできるようにしました。',
                detail: 'Playwrightの撮影後に変換で止まらず、動画付きの下書きを作れるようになります。',
              },
              {
                test: /x投稿のデモ撮影と日本語コピー|demo capture|japanese copy/,
                text: 'PRの変更内容に合う公開画面を推定し、投稿文を具体的な日本語で作るようにしました。',
                detail: 'ログイン画面を誤って撮影せず、利用者に伝わる変更点とメリットを下書きに反映します。',
              },
              {
                test: /spectat|観戦/,
                text: '観戦中にも対局の進行と履歴を確認できるようにしました。',
                detail: 'プレイヤーと同じ流れを追いながら、ゲームを見守れます。',
              },
              {
                test: /com|computer|ai|bot|プレイ速度/,
                text: 'COM対戦を改善し、ひとりでも遊び始めやすくしました。',
                detail: '空いている席をAIが補い、対局をスムーズに進められます。',
              },
            ];
            const matched = summaryRules.find((rule) => rule.test.test(titleSource))
              || summaryRules.find((rule) => rule.test.test(bodySource));
            const summary = matched || {
              text: 'ゲーム体験を見直し、より遊びやすくしました。',
              detail: '画面の表示や対局中の操作を整え、安心してプレイできるようにしています。',
            };
            const candidate = [
              'Mei-Traをアップデートしました。',
              '',
              summary.text,
              summary.detail,
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'x:review',
              per_page: 100,
            });
            const existingIssue = openIssues.find((issue) =>
              issue.body?.includes(`Source PR: #${pr.number} `),
            );
            const existingCandidate = existingIssue?.body?.match(
              /<!-- x-post:start -->\s*([\s\S]*?)\s*<!-- x-post:end -->/,
            )?.[1]?.trim();
            const oldGenericCopy = existingCandidate?.includes('より快適に遊べるよう、プレイ体験を改善しています。');
            const oldTitleCopy = existingCandidate?.includes(`「${pr.title.trim()}`);
            const oldGeneratedCopy = [
              'チーム名を分かりやすく設定できるようにしました。',
              '得点表示を見直し、現在の状況を確認しやすくしました。',
              '対局履歴と振り返り画面を分かりやすくしました。',
              'ゲーム画面の表示と操作を見直し、情報を読み取りやすくしました。',
              '接続が一時的に切れたときの復帰処理を改善しました。',
              'COM対戦を改善し、ひとりでも遊び始めやすくしました。',
              'X投稿用の下書き生成を安定化しました。',
              'ゲーム画面のラベルとコントラストを見直し、必要な情報を読み取りやすくしました。',
            ].some((text) => existingCandidate?.includes(text));
            const copy = existingCandidate && !oldGenericCopy && !oldTitleCopy && !oldGeneratedCopy
              ? existingCandidate
              : candidate;

            const body = [
              `Source PR: #${pr.number} (${pr.html_url})`,
              '',
              'これはX投稿の下書きです。投稿文は一般のユーザーにも伝わるよう、変更点とメリットを簡潔にまとめています。',
              '公開前に内容を確認し、必要なら投稿文を編集してください。',
              '',
              '<!-- x-post:start -->',
              copy,
              '<!-- x-post:end -->',
              '',
              '内容を確認したら、`/post-x` とコメントするとXへ投稿します。この操作は取り消せません。',
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              });
              core.notice(`Updated existing text-only X draft issue #${existingIssue.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `X draft: ${pr.title}`,
                body,
                labels: ['x:review'],
              });
            }
