name: Create X Post Draft

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to summarize
        required: true
        type: number

permissions:
  issues: write
  pull-requests: read

jobs:
  create-draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'x:share'))
    runs-on: ubuntu-latest

    steps:
      - name: Create a text-only approval draft
        uses: actions/github-script@v7
        env:
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(process.env.MANUAL_PR_NUMBER)
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const labels = pr.labels.map((label) => label.name);
            if (!pr.merged_at || pr.base.ref !== 'main' || !labels.includes('x:share')) {
              core.setFailed(`PR #${prNumber} must be a merged main PR with the x:share label.`);
              return;
            }

            const source = `${pr.title}\n${pr.body || ''}`.toLowerCase();
            const summaryRules = [
              {
                test: /team names|チーム名/,
                text: 'チーム名を分かりやすく設定できるようにしました。',
                detail: '対局中や履歴画面でも、チームの情報を確認しやすくなっています。',
              },
              {
                test: /score|得点|スコア/,
                text: '得点表示を見直し、現在の状況を確認しやすくしました。',
                detail: '対局中にチームごとの進み具合をすぐ把握できます。',
              },
              {
                test: /history|replay|履歴|リプレイ/,
                text: '対局履歴と振り返り画面を分かりやすくしました。',
                detail: '過去のプレイ内容を、あとから確認しやすくなっています。',
              },
              {
                test: /contrast|label|accessib|ui|画面|表示|操作性|アクセシビリティ/,
                text: 'ゲーム画面の表示と操作を見直し、情報を読み取りやすくしました。',
                detail: '暗いテーマや小さな画面でも、必要な情報を確認しやすくなっています。',
              },
              {
                test: /reconnect|connection|再接続|接続/,
                text: '接続が一時的に切れたときの復帰処理を改善しました。',
                detail: '対局中の席やゲームの状態を保ちやすくなっています。',
              },
              {
                test: /spectat|観戦/,
                text: '観戦中にも対局の進行と履歴を確認できるようにしました。',
                detail: 'プレイヤーと同じ流れを追いながら、ゲームを見守れます。',
              },
              {
                test: /com|computer|ai|bot|プレイ速度/,
                text: 'COM対戦を改善し、ひとりでも遊び始めやすくしました。',
                detail: '空いている席をAIが補い、対局をスムーズに進められます。',
              },
              {
                test: /ffmpeg|media capture|x media|投稿用|投稿/,
                text: 'X投稿用の下書き生成を安定化しました。',
                detail: '変更内容を確認しやすい日本語の投稿文を自動で用意できます。',
              },
            ];
            const matched = summaryRules.find((rule) => rule.test.test(source));
            const summary = matched || {
              text: 'ゲーム体験を見直し、より遊びやすくしました。',
              detail: '画面の表示や対局中の操作を整え、安心してプレイできるようにしています。',
            };
            const candidate = [
              'Mei-Traをアップデートしました。',
              '',
              summary.text,
              summary.detail,
            ].join('\n');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'x:review',
              per_page: 100,
            });
            const existingIssue = openIssues.find((issue) =>
              issue.body?.includes(`Source PR: #${pr.number} `),
            );
            const existingCandidate = existingIssue?.body?.match(
              /<!-- x-post:start -->\s*([\s\S]*?)\s*<!-- x-post:end -->/,
            )?.[1]?.trim();
            const oldGenericCopy = existingCandidate?.includes('より快適に遊べるよう、プレイ体験を改善しています。');
            const oldTitleCopy = existingCandidate?.includes(`「${pr.title.trim()}`);
            const copy = existingCandidate && !oldGenericCopy && !oldTitleCopy ? existingCandidate : candidate;

            const body = [
              `Source PR: #${pr.number} (${pr.html_url})`,
              '',
              'これはX投稿の下書きです。投稿文は一般のユーザーにも伝わるよう、変更点とメリットを簡潔にまとめています。',
              '公開前に内容を確認し、必要なら投稿文を編集してください。',
              '',
              '<!-- x-post:start -->',
              copy,
              '<!-- x-post:end -->',
              '',
              '内容を確認したら、`/post-x` とコメントするとXへ投稿します。この操作は取り消せません。',
            ].join('\n');

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body,
              });
              core.notice(`Updated existing text-only X draft issue #${existingIssue.number}.`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `X draft: ${pr.title}`,
                body,
                labels: ['x:review'],
              });
            }
