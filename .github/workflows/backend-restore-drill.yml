name: Backend Restore Drill

on:
  pull_request:
    paths:
      - '.github/workflows/backend-restore-drill.yml'
      - 'mei-tra-backend/.supabase-cli-version'
      - 'mei-tra-backend/package.json'
      - 'mei-tra-backend/scripts/backup-production.sh'
      - 'mei-tra-backend/scripts/verify-backup-restore.sh'
      - 'mei-tra-backend/supabase/config.toml'
      - 'mei-tra-backend/supabase/migrations/**'
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read Supabase CLI version
        id: supabase-cli
        working-directory: mei-tra-backend
        run: echo "version=$(cat .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run backup restore drill
        working-directory: mei-tra-backend
        run: bash scripts/verify-backup-restore.sh
