name: Backend Health Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test health evaluation
        run: node --test mei-tra-backend/scripts/health-monitor.test.mjs

      - name: Check production health after cold start
        env:
          HEALTH_URL: https://mei-tra-backend.fly.dev/api/health/readiness
          HEALTH_MAX_RESPONSE_MS: '30000'
          HEALTH_MAX_RSS_MB: '450'
          HEALTH_ATTEMPTS: '3'
        run: node mei-tra-backend/scripts/health-monitor.mjs
