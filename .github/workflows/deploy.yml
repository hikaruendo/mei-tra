name: Deploy to Fly.io

on:
  push:
    branches:
      - main  # mainブランチへのpushをトリガーに
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-migrations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mei-tra-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: mei-tra-backend
        run: npm ci

      - name: Read Supabase CLI version
        id: supabase-cli
        working-directory: mei-tra-backend
        run: echo "version=$(cat .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Apply migrations and verify generated database types
        working-directory: mei-tra-backend
        run: npm run db:types:check

  verify-production-migrations:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Supabase CLI version
        id: supabase-cli
        working-directory: mei-tra-backend
        run: echo "version=$(cat .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Require production Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Compare production and repository migration history
        working-directory: mei-tra-backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" > migration-list.txt
          node scripts/check-production-migrations.mjs migration-list.txt

  deploy:
    needs:
      - verify-migrations
      - verify-production-migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy app to Fly.io
        run: flyctl deploy --remote-only -c mei-tra-backend/fly.toml --dockerfile mei-tra-backend/Dockerfile.fly .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set up Node.js for production health check
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed backend health
        env:
          HEALTH_URL: https://mei-tra-backend.fly.dev/api/health
          HEALTH_MAX_RESPONSE_MS: '30000'
          HEALTH_MAX_RSS_MB: '450'
          HEALTH_ATTEMPTS: '3'
        run: node mei-tra-backend/scripts/health-monitor.mjs
