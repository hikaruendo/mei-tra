name: Mobile EAS Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: preview
      platform:
        description: Target platform
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      submit:
        description: Submit the completed build to TestFlight or Google Play internal testing
        required: true
        type: boolean
        default: false
      build-id:
        description: Submit an existing EAS build instead of creating a new build (iOS only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: mei-tra-mobile

jobs:
  release:
    name: EAS ${{ inputs.profile }} (${{ inputs.platform }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.profile == 'production' && 'mobile-production' || 'mobile-preview' }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
      EXPO_ASC_APP_ID: ${{ secrets.EXPO_ASC_APP_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EAS_CLI_VERSION: 21.1.0
      RELEASE_PROFILE: ${{ inputs.profile }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
      RELEASE_SUBMIT: ${{ inputs.submit }}
      EXISTING_BUILD_ID: ${{ inputs.build-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies for preflight
        run: npm ci

      - name: Validate EAS monorepo packaging
        run: npm run validate:eas-monorepo

      - name: Validate release prerequisites
        run: |
          set -euo pipefail

          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN is required in the selected GitHub environment.' >&2
            exit 1
          fi

          if [ "$RELEASE_PROFILE" = production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Production builds must be dispatched from main.' >&2
            exit 1
          fi

          if [ "$RELEASE_SUBMIT" = true ] && [ "$RELEASE_PROFILE" != production ]; then
            echo 'Only the production profile may be submitted by this workflow.' >&2
            exit 1
          fi

          if [ -n "$EXISTING_BUILD_ID" ]; then
            if [ "$RELEASE_SUBMIT" != true ] || [ "$RELEASE_PROFILE" != production ] || [ "$RELEASE_PLATFORM" != ios ]; then
              echo 'An existing build ID requires submit=true, profile=production, and platform=ios.' >&2
              exit 1
            fi
          fi

          if [ "$RELEASE_SUBMIT" = true ] && [ -z "$EXISTING_BUILD_ID" ] && [ "$RELEASE_PLATFORM" != android ]; then
            for name in EXPO_APPLE_ID EXPO_ASC_APP_ID EXPO_APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then
                echo "$name is required for an iOS submission." >&2
                exit 1
              fi
            done
          fi

          node - <<'NODE'
          const app = require('./app.json').expo;

          if (!app.extra?.eas?.projectId) {
            throw new Error(
              'app.json must contain expo.extra.eas.projectId. Link the app with EAS before dispatching a release.',
            );
          }

          if (!app.runtimeVersion || !app.updates?.url) {
            throw new Error(
              'app.json must contain expo.runtimeVersion and expo.updates.url for EAS Update.',
            );
          }
          NODE

      - name: Prepare iOS submit profile
        if: inputs.submit && inputs.platform != 'android' && inputs.build-id == ''
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          eas.submit.production.ios = {
            appleId: process.env.EXPO_APPLE_ID,
            ascAppId: process.env.EXPO_ASC_APP_ID,
            appleTeamId: process.env.EXPO_APPLE_TEAM_ID,
          };
          fs.writeFileSync('eas.json', `${JSON.stringify(eas, null, 2)}\n`);
          NODE

      - name: Validate resolved EAS profile
        run: |
          set -euo pipefail
          case "$RELEASE_PLATFORM" in
            all) platforms=(ios android) ;;
            ios|android) platforms=("$RELEASE_PLATFORM") ;;
            *) echo "Unsupported release platform: $RELEASE_PLATFORM" >&2; exit 1 ;;
          esac

          for platform in "${platforms[@]}"; do
            npx --yes eas-cli@${EAS_CLI_VERSION} config \
              --profile "$RELEASE_PROFILE" \
              --platform "$platform" \
              --json > "$RUNNER_TEMP/meitra-eas-config-$platform.json"
          done

      - name: Build with EAS
        if: inputs.build-id == ''
        run: |
          set -euo pipefail
          submit_args=()
          if [ "$RELEASE_SUBMIT" = true ]; then
            submit_args+=(--auto-submit-with-profile production)
          fi

          npx --yes eas-cli@${EAS_CLI_VERSION} build \
            --platform "$RELEASE_PLATFORM" \
            --profile "$RELEASE_PROFILE" \
            --non-interactive \
            --wait \
            --freeze-credentials \
            "${submit_args[@]}"

      - name: Submit existing build to TestFlight
        if: inputs.build-id != ''
        run: |
          npx --yes eas-cli@${EAS_CLI_VERSION} submit \
            --platform ios \
            --profile production \
            --id "$EXISTING_BUILD_ID" \
            --non-interactive \
            --wait
