name: Backend Database Types

on:
  pull_request:
    paths:
      - '.github/workflows/backend-database-types.yml'
      - 'mei-tra-backend/package-lock.json'
      - 'mei-tra-backend/package.json'
      - 'mei-tra-backend/.supabase-cli-version'
      - 'mei-tra-backend/scripts/generate-db-types.sh'
      - 'mei-tra-backend/src/types/database.generated.types.ts'
      - 'mei-tra-backend/supabase/config.toml'
      - 'mei-tra-backend/supabase/migrations/**'

jobs:
  verify-generated-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mei-tra-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: mei-tra-backend
        run: npm ci

      - name: Read Supabase CLI version
        id: supabase-cli
        working-directory: mei-tra-backend
        run: echo "version=$(cat .supabase-cli-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase-cli.outputs.version }}

      - name: Start local Supabase
        working-directory: mei-tra-backend
        run: supabase start

      - name: Verify generated database types
        working-directory: mei-tra-backend
        run: npm run db:types:check

      - name: Stop local Supabase
        if: always()
        working-directory: mei-tra-backend
        run: supabase stop --no-backup
