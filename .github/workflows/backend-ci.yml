name: Backend CI

on:
  pull_request:
    paths:
      - 'mei-tra-backend/**'
      - 'contracts/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mei-tra-backend

jobs:
  quality:
    name: Backend lint, typecheck, and unit tests
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mei-tra-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint:ci omits --fix so auto-fixable violations fail the build instead of
      # being silently rewritten in the runner and reported as a pass.
      - name: Lint
        run: npm run lint:ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci
